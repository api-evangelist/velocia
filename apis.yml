aid: velocia
name: Velocia
description: Velocia is a transit ridership solutions company that uses real-time rewards, incentives,
  and digital tools to increase public-transit ridership and engagement for transit agencies and
  cities. Its programs include a Rider Incentive Program, Transit Ambassador Program, Mobility
  Wallet, rider surveys, an Automated Guaranteed Ride Home Program, and Major Event Solutions,
  integrated into transit apps to drive behavior change. Velocia partners with agencies and mobility
  services such as Miami-Dade County, King County Metro, Seattle DOT, Lime, Zipcar, Uber, Lyft, and
  CitiBike Miami. Founded in 2018 and based in Toronto, Velocia is a Techstars-backed company. This
  profile has no public developer/API surface at enrichment time.
